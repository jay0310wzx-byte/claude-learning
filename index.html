<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文字云端共享站</title>
  <style>
    :root{--bg:#0b1020;--card:#141b34;--line:#2a345f;--text:#ebefff;--muted:#9ca9d9;--pri:#7aa2ff;--ok:#23c483;--warn:#ffbf46}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#090d1a,#111a36);color:var(--text)}
    .wrap{max-width:980px;margin:40px auto;padding:0 16px}
    .card{background:rgba(20,27,52,.92);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
    h1{margin:0 0 10px} p{color:var(--muted)}
    label{display:block;margin:12px 0 6px}
    input,textarea{width:100%;background:#0d1430;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}
    textarea{min-height:120px;resize:vertical}
    button{background:var(--pri);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .pill{padding:4px 10px;border-radius:999px;background:#202b53;color:var(--muted);font-size:12px}
    .item{padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:#0e1633}
    .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
    .status{font-size:13px}
    .ok{color:var(--ok)} .warn{color:var(--warn)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>☁️ 文字云端共享站</h1>
      <p>任何人都可以上传自己的文字数据。当前版本使用云端 API 接口规范；如果未配置后端，会自动回退到本地存储演示模式。</p>
      <div class="row">
        <span class="pill">匿名上传</span>
        <span class="pill">实时列表刷新</span>
        <span class="pill">支持部署到 Vercel/Netlify</span>
      </div>
    </div>

    <div class="card">
      <h2>上传文字</h2>
      <label for="author">昵称</label>
      <input id="author" placeholder="例如：小王" maxlength="30" />
      <label for="content">文字内容</label>
      <textarea id="content" placeholder="请输入你要上传的文字..." maxlength="5000"></textarea>
      <div class="row" style="margin-top:12px">
        <button id="submitBtn">上传到云端</button>
        <span id="status" class="status warn">未配置云端 API，当前为本地演示模式</span>
      </div>
    </div>

    <div class="card">
      <h2>公开文字列表</h2>
      <div id="list"></div>
    </div>
  </div>

<script>
const API_BASE = window.CLOUD_TEXT_API || ""; // 例如: https://your-api.com
const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');

function localGet(){ return JSON.parse(localStorage.getItem('texts') || '[]'); }
function localSet(data){ localStorage.setItem('texts', JSON.stringify(data)); }

async function fetchTexts(){
  if(!API_BASE){
    return localGet().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  }
  const res = await fetch(`${API_BASE}/texts`);
  if(!res.ok) throw new Error('云端读取失败');
  return res.json();
}

async function createText(payload){
  if(!API_BASE){
    const data = localGet();
    data.push(payload);
    localSet(data);
    return {ok:true, local:true};
  }
  const res = await fetch(`${API_BASE}/texts`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!res.ok) throw new Error('云端上传失败');
  return res.json();
}

function render(items){
  if(!items.length){ listEl.innerHTML = '<p>暂无数据，来上传第一条吧。</p>'; return; }
  listEl.innerHTML = items.map(i => `\n    <div class="item">\n      <div class="meta"><b>${escapeHTML(i.author || '匿名用户')}</b><span>${new Date(i.createdAt).toLocaleString()}</span></div>\n      <div style="margin-top:8px;white-space:pre-wrap;line-height:1.7">${escapeHTML(i.content)}</div>\n    </div>`).join('');
}

function escapeHTML(str=''){ return str.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }

async function refresh(){
  const data = await fetchTexts();
  render(data);
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const author = document.getElementById('author').value.trim() || '匿名用户';
  const content = document.getElementById('content').value.trim();
  if(!content){ alert('请输入文字内容'); return; }

  const payload = {author, content, createdAt: new Date().toISOString()};
  try{
    await createText(payload);
    document.getElementById('content').value = '';
    statusEl.textContent = API_BASE ? '已上传到云端 ✅' : '本地演示模式：已保存 ✅';
    statusEl.className = 'status ok';
    await refresh();
  }catch(e){
    statusEl.textContent = e.message;
    statusEl.className = 'status warn';
  }
});

if(API_BASE){ statusEl.textContent = `已连接云端 API：${API_BASE}`; statusEl.className='status ok'; }
refresh();
</script>
</body>
</html>
